name: Build VoltageOS 5.12 (A16) for veux

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'veux'

env:
  MANIFEST_URL: 'https://github.com/VoltageOS/manifest'
  MANIFEST_BRANCH: '16.2'
  LOCAL_MANIFEST_URL: 'https://raw.githubusercontent.com/dukeoftoad/local_manifests/main/veux.xml'
  VARIANT_TAG: 'a16-5.12'
  DEVICE: 'veux'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
                      /usr/local/share/boost /usr/lib/jvm
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "After cleanup:"
          df -h

      - name: Pick work directory on biggest disk
        run: |
          ROOT_AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          MNT_AVAIL=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)
          if [ "$MNT_AVAIL" -gt "$ROOT_AVAIL" ]; then WORKDIR=/mnt/rom; else WORKDIR=$HOME/rom; fi
          echo "WORKDIR=$WORKDIR" >> $GITHUB_ENV
          sudo mkdir -p "$WORKDIR" && sudo chown -R $USER:$USER "$WORKDIR"

      - name: Add 16G swap
        run: |
          sudo fallocate -l 16G "$WORKDIR/swapfile" || sudo dd if=/dev/zero of="$WORKDIR/swapfile" bs=1M count=16384
          sudo chmod 600 "$WORKDIR/swapfile"
          sudo mkswap "$WORKDIR/swapfile"
          sudo swapon "$WORKDIR/swapfile"
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison gperf build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            bc libssl-dev libncurses-dev imagemagick python3 git-lfs lzop libxml2 rsync
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git lfs install
          git config --global user.name "dukeoftoad"
          git config --global user.email "dukeoftoad@users.noreply.github.com"
          git config --global color.ui false

      - name: repo init + local manifest (VoltageOS 16.2 / Android 16 QPR2)
        run: |
          cd "$WORKDIR"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --git-lfs
          mkdir -p .repo/local_manifests
          curl -sL "$LOCAL_MANIFEST_URL?cb=$(date +%s)" -o .repo/local_manifests/veux.xml
          cat .repo/local_manifests/veux.xml

      - name: repo sync (retry-hardened)
        run: |
          cd "$WORKDIR"
          SYNC_OK=0
          for attempt in 1 2 3; do
            if repo sync -c -j8 --no-clone-bundle --no-tags --fail-fast; then
              SYNC_OK=1
              break
            fi
            echo "::warning::repo sync attempt ${attempt} failed (exit $?)"
            sleep 90
          done
          if [ "$SYNC_OK" -ne 1 ]; then
            echo "falling back to low-parallelism sync"
            repo sync -c -j4 --no-clone-bundle --no-tags
          fi
          df -h

      - name: Build ROM (voltage_veux userdebug, security patch 2026-10-01)
        run: |
          cd "$WORKDIR"
          set -o pipefail
          source build/envsetup.sh
          brunch $DEVICE userdebug 2>&1 | tee build.log

      - name: Collect build artifacts
        if: always()
        run: |
          OUT="$WORKDIR/out/target/product/$DEVICE"
          mkdir -p artifacts
          find "$OUT" -maxdepth 1 -name "*.zip" -exec cp {} artifacts/ \; || true
          for f in boot.img dtbo.img vendor_boot.img recovery.img vbmeta.img; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" artifacts/
          done
          [ -f "$WORKDIR/build.log" ] && cp "$WORKDIR/build.log" artifacts/
          ls -lh artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veux-${{ env.VARIANT_TAG }}-run${{ github.run_number }}
          path: artifacts/*
          retention-days: 7
          if-no-files-found: warn
